dependencies {
    compileOnly project(':bedwars-api')
    implementation project(':versionsupport_common')
    compileOnly('org.spigotmc:spigot:1.21.11-R0.2-SNAPSHOT') {
        exclude group: 'commons-lang', module: 'commons-lang'
    }
    compileOnly 'com.saicone:rtag:1.5.19-SNAPSHOT'
    // Other modules
    compileOnly 'com.saicone:rtag-block:1.5.19-SNAPSHOT'
    compileOnly 'com.saicone:rtag-entity:1.5.19-SNAPSHOT'
    compileOnly 'com.saicone:rtag-item:1.5.19-SNAPSHOT'
}

tasks.named('compileJava', JavaCompile) {
    options.release = 21
}

repositories {
    // Important Repos
    mavenCentral()
    mavenLocal()
    maven { url = uri('https://repo.codemc.io/repository/nms/') } // Spigot
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') } // com.mojang (dep of Spigot)
    maven { // RTag snapshots
        url = uri('https://central.sonatype.com/repository/maven-snapshots')
        mavenContent {
            snapshotsOnly()
            includeGroup 'com.saicone'
        }
    }
}

description = 'versionsupport_v1_21_r7'
